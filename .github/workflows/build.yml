name: Construire le .exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils
        run: python -m pip install --upgrade pip pyinstaller minecraft-launcher-lib

      - name: Construire LohyxHub.exe
        run: python -m PyInstaller --noconsole --onefile --name LohyxHub --icon lohyx_icone.ico LohyxHub.pyw

      - name: Afficher l'empreinte sha256
        shell: pwsh
        run: Get-FileHash dist/LohyxHub.exe -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: LohyxHub-exe
          path: dist/LohyxHub.exe

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LohyxHub.exe
